<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to PIC Of Rescue Unmanned Aerial Vehicle</title>
    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/7.13.1/firebase-app.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/7.13.1/firebase-firestore.js"></script>
    <!-- initialize the SDK after all desired features are loaded -->
    <script defer src="/__/firebase/init.js"></script>

    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>
<h1>Welcome to POC Of Rescue Unmanned Aerial Vehicle</h1>
<div id="buttons">
    <button class="mdc-button mdc-button--raised" id="cameraBtn">
        <i class="material-icons mdc-button__icon" aria-hidden="true">perm_camera_mic</i>
        <span class="mdc-button__label">Open camera & microphone</span>
    </button>
    <button class="mdc-button mdc-button--raised" disabled id="createBtn">
        <i class="material-icons mdc-button__icon" aria-hidden="true">group_add</i>
        <span class="mdc-button__label">Create room</span>
    </button>
    <button class="mdc-button mdc-button--raised" disabled id="joinBtn">
        <i class="material-icons mdc-button__icon" aria-hidden="true">group</i>
        <span class="mdc-button__label">Join room</span>
    </button>
    <button class="mdc-button mdc-button--raised" disabled id="hangupBtn">
        <i class="material-icons mdc-button__icon" aria-hidden="true">close</i>
        <span class="mdc-button__label">Hangup</span>
    </button>
    <button class="mdc-button mdc-button--raised" id="quickJoinRoomBtn" style="display:none;" disabled>
        <i class="material-icons mdc-button__icon" aria-hidden="true">meeting_room</i>
        <span class="mdc-button__label">Join Telemetry Room</span>
    </button>
</div>
<div>
    <span id="currentRoom"></span>
</div>
<div id="videos">
    <video style="display: none;" id="localVideo" muted autoplay playsinline></video>

    <video id="remoteVideo" autoplay playsinline></video>
    
    <div id="robotControls" aria-label="Robot controls">
        <div class="robot-grid">
            <div></div>
            <div id="robotStatus">Not connected</div>
            <div></div>
            <button class="mdc-button mdc-button--raised" id="btnForward" data-cmd="forward" disabled>
                <span class="mdc-button__label">Forward</span>
            </button>
            <div></div>

            <button class="mdc-button mdc-button--raised" id="btnLeft" data-cmd="left" disabled>
                <span class="mdc-button__label">Left</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnHold" data-cmd="pos_hold" disabled>
                <span class="mdc-button__label">Position Hold</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnRight" data-cmd="right" disabled>
                <span class="mdc-button__label">Right</span>
            </button>

            <div></div>
            <button class="mdc-button mdc-button--raised" id="btnBack" data-cmd="back" disabled>
                <span class="mdc-button__label">Back</span>
            </button>
            <div></div>
        </div>

        <div class="robot-row">
            <button class="mdc-button mdc-button--raised" id="btnAltHold" data-cmd="alt_hold" disabled>
                <span class="mdc-button__label">Alt Hold</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnExtra1" data-cmd="extra_1" disabled>
                <span class="mdc-button__label">Extra 1</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnExtra2" data-cmd="extra_2" disabled>
                <span class="mdc-button__label">Extra 2</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnExtra3" data-cmd="extra_3" disabled>
                <span class="mdc-button__label">Extra 3</span>
            </button>
        </div>

        <div class="robot-row">
            <button class="mdc-button mdc-button--raised" id="btnRestart" data-cmd="restart" data-transport="mqtt" disabled>
                <span class="mdc-button__label">Restart</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnReload" data-cmd="reload" data-transport="mqtt" disabled>
                <span class="mdc-button__label">Reload</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnForceStop" data-cmd="force_stop" data-transport="mqtt" disabled>
                <span class="mdc-button__label">Force Stop</span>
            </button>
            <button class="mdc-button mdc-button--raised" id="btnGetInfo" data-cmd="get_info" data-transport="mqtt" disabled>
                <span class="mdc-button__label">Get Info</span>
            </button>
        </div>

        <div class="servo-controls" aria-label="Servo potentiometer controls">
            <div class="servo-item">
                <label for="servo1Pot">Servo 1 (t:16) angle: <span id="servo1Value">90</span></label>
                <input type="range" id="servo1Pot" min="0" max="180" step="1" value="90" disabled>
            </div>
            <div class="servo-item">
                <label for="servo2Pot">Servo 2 (t:17) angle: <span id="servo2Value">90</span></label>
                <input type="range" id="servo2Pot" min="0" max="180" step="1" value="90" disabled>
            </div>
            <div class="servo-item">
                <label for="speedPot">Speed (v): <span id="speedValue">100</span></label>
                <input type="range" id="speedPot" min="0" max="255" step="1" value="100" disabled>
            </div>
        </div>
    </div>
</div>

<div id="mqttPanel" aria-label="MQTT monitor">
    <h2>MQTT Monitor</h2>
    <div id="mqttStatus">MQTT: Not connected</div>
    <div id="mqttMessages"></div>
</div>

<div id="chat" style="display: none;">
    <h2>DataChannel chat</h2>
    <div id="chatStatus">Not connected</div>
    <div id="messages" aria-live="polite"></div>
    <div id="chatControls">
        <div class="mdc-text-field" id="chatTextField">
            <input type="text" id="msgInput" class="mdc-text-field__input" placeholder="Type a message" disabled>
            <div class="mdc-line-ripple"></div>
        </div>
        <button class="mdc-button mdc-button--raised" id="sendMsgBtn" disabled>
            <span class="mdc-button__label">Send</span>
        </button>
    </div>
</div>

<div id="robot" style="display: none;">
    <h2>Robot controls</h2>
    
    <!-- Add robot control buttons here -->
</div>
<div class="mdc-dialog"
     id="room-dialog"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="my-dialog-title"
     aria-describedby="my-dialog-content">
    <div class="mdc-dialog__container">
        <div class="mdc-dialog__surface">
            <h2 class="mdc-dialog__title" id="my-dialog-title">Join room</h2>
            <div class="mdc-dialog__content" id="my-dialog-content">
                Enter ID for room to join:
                <div class="mdc-text-field">
                    <input type="text" id="room-id" class="mdc-text-field__input">
                    <label class="mdc-floating-label" for="my-text-field">Room ID</label>
                    <div class="mdc-line-ripple"></div>
                </div>
            </div>
            <footer class="mdc-dialog__actions">
                <button type="button" class="mdc-button mdc-dialog__button" data-mdc-dialog-action="no">
                    <span class="mdc-button__label">Cancel</span>
                </button>
                <button id="confirmJoinBtn" type="button" class="mdc-button mdc-dialog__button"
                        data-mdc-dialog-action="yes">
                    <span class="mdc-button__label">Join</span>
                </button>
            </footer>
        </div>
    </div>
    <div class="mdc-dialog__scrim"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
